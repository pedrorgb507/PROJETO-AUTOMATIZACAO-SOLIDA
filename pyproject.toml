[project]
name = "finart-ctp"
version = "3.0.0"
description = "Automacao CTP da Finart: separa tintas e gera o PDF do CTP sem Photoshop/InDesign"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
    "pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
finart-ctp = "finart_ctp.monitor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
